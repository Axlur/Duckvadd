<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duckvadd & Jakten på Fläcken - 8-Bit Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Grundläggande 8-bitars stil och skarp pixelrendering */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #0f0f1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* Arkadkabinett-ram */
        #arcade-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }

        #screen-bezel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 4px solid #3b3b54;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
        }

        /* Subtila CRT-scanlines */
        .crt-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.22) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* HUD Topp-panel */
        #hud-bar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1a1a2e;
            border: 3px solid #3b3b54;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 10px;
        }

        @media (min-width: 640px) {
            #hud-bar {
                font-size: 12px;
                padding: 10px 16px;
            }
        }

        .health-bar-bg {
            width: 110px;
            height: 14px;
            background: #3a0ca3;
            border: 2px solid #fff;
            border-radius: 2px;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            .health-bar-bg {
                width: 150px;
                height: 16px;
            }
        }

        #health-fill {
            height: 100%;
            width: 100%;
            background: #00f5d4;
            transition: width 0.15s steps(4);
        }

        /* 8-bitars knappar */
        .btn-8bit {
            background: #ff9e00;
            color: #1a1a2e;
            border: 3px solid #ffffff;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 9px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b56500;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        @media (min-width: 640px) {
            .btn-8bit {
                font-size: 11px;
                padding: 8px 12px;
            }
        }

        .btn-8bit:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b56500;
        }

        .btn-8bit:disabled {
            background: #4a4e69;
            color: #9a8c98;
            border-color: #6c757d;
            box-shadow: 0 4px 0 #22223b;
            cursor: not-allowed;
        }

        /* Pekk-kontroller för mobil/pekskärm */
        #touch-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
            touch-action: none;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
        }

        .touch-btn {
            background: rgba(59, 59, 84, 0.85);
            border: 2px solid #8d99ae;
            border-radius: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 3px 0 #2b2d42;
            touch-action: none;
        }

        .touch-btn:active {
            background: #00e5ff;
            color: #000;
            transform: translateY(2px);
        }

        .action-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
        }
    </style>
</head>
<body>

<div id="arcade-container">
    <!-- HUD med Hälsa, Skott, Pengar och Hundmats-knapp -->
    <div id="hud-bar">
        <div class="flex items-center gap-2">
            <span class="text-cyan-300">DUCKVADD</span>
            <div class="health-bar-bg">
                <div id="health-fill"></div>
            </div>
        </div>

        <div class="flex items-center gap-3 sm:gap-5">
            <div class="text-yellow-300" title="Revolverskott">
                🔫 <span id="ammo-display">30</span>
            </div>
            <div class="text-green-400" title="Pengar från katter">
                💰 <span id="money-display">0</span>kr
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="buy-dogfood-btn" class="btn-8bit" disabled onclick="buyDogFood()">
                🥫 HUNDMAT 15kr
            </button>
            <button id="mute-btn" class="btn-8bit !bg-cyan-400 !shadow-[0_4px_0_#0077b6]" onclick="toggleMute()">
                🔊
            </button>
        </div>
    </div>

    <!-- Huvudskärm med Canvas -->
    <div id="screen-bezel">
        <canvas id="gameCanvas" tabindex="0"></canvas>
        <div class="crt-overlay"></div>
    </div>

    <!-- Pekk-kontroller + tangentbordstips -->
    <div id="touch-controls">
        <div class="dpad-grid md:hidden">
            <div></div>
            <button class="touch-btn" data-key="ArrowUp">▲</button>
            <div></div>
            <button class="touch-btn" data-key="ArrowLeft">◄</button>
            <div></div>
            <button class="touch-btn" data-key="ArrowRight">►</button>
            <div></div>
            <button class="touch-btn" data-key="ArrowDown">▼</button>
            <div></div>
        </div>

        <div class="hidden md:block text-[10px] text-gray-400 leading-relaxed">
            STYR: <span class="text-white">PILAR / WASD</span> &nbsp;|&nbsp; 
            SKJUT: <span class="text-yellow-300">Z / SPACE</span> &nbsp;|&nbsp; 
            VINGSLAG: <span class="text-cyan-300">X</span> &nbsp;|&nbsp; 
            HUNDMAT: <span class="text-orange-300">H</span>
        </div>

        <button id="story-next-btn" class="btn-8bit !bg-cyan-400 !shadow-[0_4px_0_#0077b6]" onclick="handleStartOrNext()">
            ▶ STARTA
        </button>

        <div class="flex gap-3 md:hidden">
            <button class="touch-btn action-btn !bg-cyan-700 !border-cyan-300" data-key="KeyX">VINGE</button>
            <button class="touch-btn action-btn !bg-red-700 !border-yellow-300" data-key="KeyZ">SKJUT</button>
        </div>
    </div>
</div>

<script>
/**
 * DUCKVADD & JAKTEN PÅ FLÄCKEN
 * Ett komplett 8-bitars Beat 'em Up / Run 'n Gun spel inspirerat av Double Dragon.
 */

// --- LJUDMOTOR (8-BITARS CHIPTUNE & LJUDEFFEKTER VIA WEB AUDIO API) ---
class RetroSound {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmInterval = null;
        this.bgmStep = 0;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type, duration, vol = 0.12, slideTo = null) {
        if (this.muted || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    playNoise(duration, vol = 0.18) {
        if (this.muted || !this.ctx) return;
        try {
            const bufferSize = this.ctx.sampleRate * duration;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 900;

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        } catch (e) {}
    }

    shoot() {
        this.playNoise(0.12, 0.22);
        this.playTone(520, 'square', 0.09, 0.14, 110);
    }

    emptyClick() {
        this.playTone(900, 'square', 0.04, 0.08, 600);
    }

    wingSlap() {
        this.playTone(260, 'triangle', 0.12, 0.16, 120);
    }

    catHit() {
        this.playTone(680, 'sawtooth', 0.14, 0.12, 280);
    }

    catDefeat() {
        this.playTone(440, 'square', 0.08, 0.12, 220);
        setTimeout(() => this.playTone(190, 'sawtooth', 0.16, 0.12, 95), 70);
    }

    pickup() {
        this.playTone(587.33, 'square', 0.07, 0.1);
        setTimeout(() => this.playTone(880, 'square', 0.12, 0.1), 65);
    }

    eatDogFood() {
        const notes = [330, 440, 554, 659];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'square', 0.09, 0.11), idx * 60);
        });
    }

    rocketLaunch() {
        this.playNoise(1.4, 0.25);
        this.playTone(110, 'sawtooth', 1.4, 0.15, 620);
    }

    startBGM(mode = 'battle') {
        this.stopBGM();
        const battleBass = [110, 110, 130.8, 146.8, 110, 110, 164.8, 146.8];
        const spaceLead = [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 293.7, 392.0];
        this.bgmStep = 0;

        this.bgmInterval = setInterval(() => {
            if (this.muted || !this.ctx || gameState !== 'PLAYING') return;
            if (mode === 'space') {
                const note = spaceLead[this.bgmStep % spaceLead.length];
                this.playTone(note, 'triangle', 0.18, 0.06);
            } else {
                const note = battleBass[this.bgmStep % battleBass.length];
                this.playTone(note, 'triangle', 0.14, 0.07);
                if (this.bgmStep % 4 === 2) {
                    this.playNoise(0.05, 0.04);
                }
            }
            this.bgmStep++;
        }, 210);
    }

    stopBGM() {
        if (this.bgmInterval) {
            clearInterval(this.bgmInterval);
            this.bgmInterval = null;
        }
    }
}

const sfx = new RetroSound();

// --- SPELKONSTANTER & VIRTUELL 8-BITARS UPPLÖSNING ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const V_WIDTH = 480;
const V_HEIGHT = 270;
canvas.width = V_WIDTH;
canvas.height = V_HEIGHT;

const LANE_TOP = 152;
const LANE_BOTTOM = 250;

// --- SPELTILLSTÅND ---
let gameState = 'TITLE'; // TITLE, INTRO, PLAYING, STAGE_CLEAR, GAME_OVER, VICTORY
let introScene = 0;
let currentStage = 1; // 1: Staden, 2: Leifs Kattfästning, 3: Hamsterplaneten (Raketflykt)
let cameraX = 0;
let frameCount = 0;
let screenShake = 0;
let stageMessage = '';
let stageMessageTimer = 0;

// --- SPELARE (DUCKVADD - TURKOS COWBOY-ANKA) ---
const player = {
    x: 70,
    y: 205,
    vx: 0,
    vy: 0,
    speed: 2.1,
    facing: 1, // 1 = höger, -1 = vänster
    hp: 100,
    maxHp: 100,
    ammo: 30, // Börjar med 30 skott!
    money: 0,
    shootCooldown: 0,
    meleeTimer: 0,
    invulnTimer: 0,
    walkFrame: 0
};

// --- ENTITETER & OBJEKT ---
let enemies = [];
let bullets = [];
let pickups = [];
let particles = [];
let floatingTexts = [];
let stars = [];
let cage = null;
let rocket = null;
let wavesTriggered = {};

// --- INMATNING ---
const keys = {};

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
    }

    if (gameState === 'TITLE' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ') {
            startIntro();
        }
        return;
    }

    if (gameState === 'INTRO') {
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ' || e.code === 'ArrowRight') {
            advanceIntro();
        } else if (e.code === 'Escape') {
            startNewGame();
        }
        return;
    }

    if (gameState === 'PLAYING') {
        if (e.code === 'KeyZ' || e.code === 'Space') {
            handlePrimaryAction();
        }
        if (e.code === 'KeyX') {
            doWingAttack();
        }
        if (e.code === 'KeyH') {
            buyDogFood();
        }
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

// Klick / tryck direkt på spelskärmen för att starta eller bläddra i introt
canvas.addEventListener('click', () => {
    if (gameState === 'TITLE' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        startIntro();
    } else if (gameState === 'INTRO') {
        advanceIntro();
    }
});

// Touch-knappar för mobil/surfplatta
document.querySelectorAll('.touch-btn').forEach(btn => {
    const code = btn.getAttribute('data-key');
    btn.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        keys[code] = true;
        if (gameState === 'TITLE' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
            startIntro();
        } else if (gameState === 'INTRO') {
            advanceIntro();
        } else if (gameState === 'PLAYING') {
            if (code === 'KeyZ') handlePrimaryAction();
            if (code === 'KeyX') doWingAttack();
        }
    });
    btn.addEventListener('touchend', (e) => {
        if (e.cancelable) e.preventDefault();
        keys[code] = false;
    });
});

// --- HUD & BUTIK ---
function updateHUD() {
    const hpPct = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
    const fill = document.getElementById('health-fill');
    fill.style.width = hpPct + '%';
    fill.style.background = hpPct > 50 ? '#00f5d4' : (hpPct > 25 ? '#fee440' : '#ff0055');

    document.getElementById('ammo-display').textContent = player.ammo;
    document.getElementById('money-display').textContent = player.money;

    const btn = document.getElementById('buy-dogfood-btn');
    btn.disabled = !(gameState === 'PLAYING' && player.money >= 15 && player.hp < player.maxHp);

    const storyBtn = document.getElementById('story-next-btn');
    if (storyBtn) {
        if (gameState === 'TITLE') {
            storyBtn.style.display = 'inline-block';
            storyBtn.textContent = '▶ STARTA';
        } else if (gameState === 'INTRO') {
            storyBtn.style.display = 'inline-block';
            storyBtn.textContent = introScene < INTRO_PANELS.length - 1 ? 'NÄSTA ►' : 'SPELA! ►';
        } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
            storyBtn.style.display = 'inline-block';
            storyBtn.textContent = '↻ IGEN';
        } else {
            storyBtn.style.display = 'none';
        }
    }
}

function handleStartOrNext() {
    canvas.focus();
    if (gameState === 'TITLE' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        startIntro();
    } else if (gameState === 'INTRO') {
        advanceIntro();
    }
}

function toggleMute() {
    sfx.init();
    sfx.muted = !sfx.muted;
    document.getElementById('mute-btn').textContent = sfx.muted ? '🔇' : '🔊';
}

// --- INTRO & STORYTELLING (4 BILDRUTOR) ---
const INTRO_PANELS = [
    {
        title: '1. HEMKOMSTEN',
        lines: [
            'DUCKVADD KOMMER HEM TILL SIN',
            'BÄSTA VÄN HAMSTERN FLÄCKEN...',
            'MEN DÖRREN STÅR PÅ VID GAVEL!'
        ]
    },
    {
        title: '2. DEN UPPBRUTNA BUREN',
        lines: [
            'BUREN ÄR SÖNDERBRUTEN OCH',
            'FLÄCKEN ÄR SPÅRLÖST BORTA!',
            'KVAR LIGGER EN SKRYNKLIG LAPP...'
        ]
    },
    {
        title: '3. BREVET FRÅN LEIF',
        lines: [
            '"JAG SKA GÖRA FLÄCKEN TILL EN',
            'ROBOTHAMSTER OCH TA ÖVER ALLA',
            'GODISFABRIKER! INGET LÖRDAGSGODIS',
            'TILL BARNEN! / KATTDIKTATORN LEIF"'
        ]
    },
    {
        title: '4. DUCKVADDS LÖFTE',
        lines: [
            'ALDRIG! DUCKVADD LADDAR SIN',
            'REVOLVER MED 30 SKOTT FÖR ATT',
            'RÄDDA FLÄCKEN & LÖRDAGSGODISEN!'
        ]
    }
];

function startIntro() {
    sfx.init();
    introScene = 0;
    gameState = 'INTRO';
    sfx.pickup();
    updateHUD();
}

function advanceIntro() {
    sfx.init();
    introScene++;
    if (introScene >= INTRO_PANELS.length) {
        startNewGame();
    } else {
        sfx.playTone(440 + introScene * 90, 'square', 0.08, 0.1);
        updateHUD();
    }
}

function showBanner(text) {
    stageMessage = text;
    stageMessageTimer = 140;
}

function startNewGame() {
    sfx.init();
    player.hp = 100;
    player.maxHp = 100;
    player.ammo = 30;
    player.money = 0;
    player.invulnTimer = 0;
    player.shootCooldown = 0;
    player.meleeTimer = 0;
    loadStage(1);
    gameState = 'PLAYING';
    updateHUD();
}

function loadStage(stageNum) {
    currentStage = stageNum;
    cameraX = 0;
    enemies = [];
    bullets = [];
    pickups = [];
    particles = [];
    floatingTexts = [];
    wavesTriggered = {};
    cage = null;
    rocket = null;

    if (stageNum === 1) {
        player.x = 70;
        player.y = 205;
        player.facing = 1;
        pickups.push({ x: 460, y: 185, type: 'ammo', amount: 12 });
        pickups.push({ x: 980, y: 225, type: 'ammo', amount: 15 });
        showBanner('BANA 1: KATTSTADEN');
        sfx.startBGM('battle');
    } else if (stageNum === 2) {
        player.x = 70;
        player.y = 205;
        player.facing = 1;
        cage = { x: 1380, y: 198, hp: 45, broken: false, hamsterFreedTimer: 0 };
        pickups.push({ x: 520, y: 175, type: 'ammo', amount: 15 });
        pickups.push({ x: 1050, y: 230, type: 'ammo', amount: 18 });
        showBanner('BANA 2: LEIFS KATTFÄSTNING');
        sfx.startBGM('battle');
    } else if (stageNum === 3) {
        player.x = 85;
        player.y = V_HEIGHT / 2;
        player.facing = 1;
        stars = Array.from({ length: 45 }, () => ({
            x: Math.random() * V_WIDTH,
            y: Math.random() * V_HEIGHT,
            speed: 1.2 + Math.random() * 2.8,
            size: Math.random() > 0.7 ? 2 : 1
        }));
        rocket = {
            distance: 0,
            targetDistance: 2600,
            planetX: V_WIDTH + 180
        };
        showBanner('BANA 3: MOT HAMSTERPLANETEN!');
        sfx.rocketLaunch();
        sfx.startBGM('space');
    }
    updateHUD();
}

function spawnEnemy(type, x, y) {
    const stats = {
        alley:  { hp: 30,  maxHp: 30,  speed: 1.15, dmg: 10, reward: 8,  w: 16, h: 26 },
        ninja:  { hp: 25,  maxHp: 25,  speed: 1.75, dmg: 12, reward: 10, w: 16, h: 26 },
        chonky: { hp: 55,  maxHp: 55,  speed: 0.85, dmg: 16, reward: 15, w: 22, h: 28 },
        leif:   { hp: 160, maxHp: 160, speed: 1.35, dmg: 18, reward: 50, w: 24, h: 34 }
    }[type];

    enemies.push({
        type,
        x,
        y,
        hp: stats.hp,
        maxHp: stats.maxHp,
        speed: stats.speed,
        dmg: stats.dmg,
        reward: stats.reward,
        w: stats.w,
        h: stats.h,
        facing: -1,
        anim: Math.random() * 5,
        hurtTimer: 0,
        attackCooldown: 30
    });
}

function checkStageWaves() {
    if (currentStage === 1) {
        if (!wavesTriggered.w1 && cameraX >= 10) {
            wavesTriggered.w1 = true;
            spawnEnemy('alley', 360, 175);
            spawnEnemy('alley', 410, 225);
        }
        if (!wavesTriggered.w2 && cameraX >= 340) {
            wavesTriggered.w2 = true;
            spawnEnemy('alley', cameraX + V_WIDTH + 20, 170);
            spawnEnemy('ninja', cameraX + V_WIDTH + 50, 220);
            spawnEnemy('alley', cameraX - 20, 200);
        }
        if (!wavesTriggered.w3 && cameraX >= 740) {
            wavesTriggered.w3 = true;
            spawnEnemy('chonky', cameraX + V_WIDTH + 25, 195);
            spawnEnemy('ninja', cameraX + V_WIDTH + 60, 165);
            spawnEnemy('alley', cameraX + V_WIDTH + 60, 235);
        }
        if (!wavesTriggered.w4 && cameraX >= 1060) {
            wavesTriggered.w4 = true;
            spawnEnemy('chonky', cameraX + V_WIDTH + 20, 175);
            spawnEnemy('chonky', cameraX + V_WIDTH + 45, 228);
            spawnEnemy('ninja', cameraX - 20, 195);
        }
        if (wavesTriggered.w4 && enemies.length === 0 && player.x >= 1490) {
            loadStage(2);
        }
    } else if (currentStage === 2) {
        if (!wavesTriggered.s2w1 && cameraX >= 20) {
            wavesTriggered.s2w1 = true;
            spawnEnemy('ninja', 390, 172);
            spawnEnemy('chonky', 430, 225);
        }
        if (!wavesTriggered.s2w2 && cameraX >= 450) {
            wavesTriggered.s2w2 = true;
            spawnEnemy('ninja', cameraX + V_WIDTH + 20, 168);
            spawnEnemy('ninja', cameraX + V_WIDTH + 45, 232);
            spawnEnemy('chonky', cameraX - 20, 200);
        }
        if (!wavesTriggered.boss && cameraX >= 950) {
            wavesTriggered.boss = true;
            showBanner('KATTDIKTATORN LEIF ANFALLER!');
            spawnEnemy('leif', 1320, 200);
            spawnEnemy('ninja', 1290, 165);
            spawnEnemy('alley', 1290, 235);
        }
    }
}

function handlePrimaryAction() {
    if (currentStage === 3) {
        if (player.shootCooldown > 0) return;
        if (player.ammo > 0) {
            player.ammo--;
            player.shootCooldown = 10;
            sfx.shoot();
            bullets.push({
                x: player.x + 34,
                y: player.y,
                vx: 7.5,
                vy: 0,
                life: 70
            });
            updateHUD();
        } else {
            sfx.emptyClick();
            spawnFloatingText(player.x, player.y - 22, 'TOMT MAGASIN!', '#ff0055');
        }
        return;
    }

    if (player.shootCooldown > 0) return;
    if (player.ammo > 0) {
        player.ammo--;
        player.shootCooldown = 14;
        sfx.shoot();
        bullets.push({
            x: player.x + player.facing * 16,
            y: player.y - 16,
            vx: player.facing * 6.8,
            vy: 0,
            life: 65
        });
        updateHUD();
    } else {
        sfx.emptyClick();
        doWingAttack();
    }
}

function doWingAttack() {
    if (currentStage === 3 || player.meleeTimer > 0) return;
    player.meleeTimer = 14;
    sfx.wingSlap();

    const reachX = player.x + player.facing * 24;
    enemies.forEach(en => {
        if (Math.abs(en.x - reachX) < 26 && Math.abs(en.y - player.y) < 22) {
            damageEnemy(en, 14, player.facing * 6);
        }
    });

    if (cage && !cage.broken) {
        if (Math.abs(cage.x - reachX) < 28 && Math.abs(cage.y - player.y) < 24) {
            damageCage(15);
        }
    }
}

function damageEnemy(en, dmg, knockback) {
    en.hp -= dmg;
    en.hurtTimer = 8;
    en.x += knockback;
    sfx.catHit();
    spawnParticles(en.x, en.y - 14, '#fee440', 6);

    if (en.hp <= 0) {
        player.money += en.reward;
        sfx.catDefeat();
        spawnParticles(en.x, en.y - 14, '#ff0055', 14);
        spawnFloatingText(en.x, en.y - 24, `+${en.reward}kr`, '#38b000');
        updateHUD();
    }
}

function buyDogFood() {
    sfx.init();
    if (gameState !== 'PLAYING') return;
    if (player.money >= 15 && player.hp < player.maxHp) {
        player.money -= 15;
        player.hp = Math.min(player.maxHp, player.hp + 45);
        sfx.eatDogFood();
        spawnParticles(player.x, player.y - 18, '#00f5d4', 12);
        spawnFloatingText(player.x, player.y - 34, 'MUMS! +45 HP', '#00f5d4');
        updateHUD();
    }
}

function damageCage(dmg) {
    if (!cage || cage.broken) return;
    const leifAlive = enemies.some(e => e.type === 'leif' && e.hp > 0);
    if (leifAlive) {
        spawnFloatingText(cage.x, cage.y - 42, 'BESEGRA LEIF FÖRST!', '#ff0055');
        return;
    }

    cage.hp -= dmg;
    sfx.catHit();
    screenShake = 4;
    spawnParticles(cage.x, cage.y - 18, '#00e5ff', 10);

    if (cage.hp <= 0) {
        cage.broken = true;
        cage.hamsterFreedTimer = 150;
        sfx.pickup();
        showBanner('FLÄCKEN ÄR FRI! MOT RAKETEN!');
        spawnFloatingText(cage.x, cage.y - 40, 'TACK DUCKVADD!', '#fee440');
    }
}

// --- EFFEKTER ---
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4.5,
            vy: (Math.random() - 0.5) * 4.5 - 1,
            color,
            size: Math.random() > 0.5 ? 3 : 2,
            life: 18 + Math.random() * 14
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({
        x, y,
        text,
        color,
        life: 55
    });
}

// --- HUVUDUPPDATERINGSLOOP ---
function update() {
    frameCount++;
    if (screenShake > 0) screenShake--;
    if (stageMessageTimer > 0) stageMessageTimer--;

    if (gameState !== 'PLAYING') return;

    if (currentStage === 3) {
        updateSpaceStage();
        return;
    }

    checkStageWaves();

    if (player.shootCooldown > 0) player.shootCooldown--;
    if (player.meleeTimer > 0) player.meleeTimer--;
    if (player.invulnTimer > 0) player.invulnTimer--;

    let moveX = 0;
    let moveY = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;
    if (keys['ArrowUp'] || keys['KeyW']) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY += 1;

    if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
        player.x += moveX * player.speed;
        player.y += moveY * (player.speed * 0.78);
        if (moveX > 0) player.facing = 1;
        if (moveX < 0) player.facing = -1;
        player.walkFrame += 0.22;
    } else {
        player.walkFrame = 0;
    }

    const maxStageX = currentStage === 1 ? 1580 : 1460;
    player.x = Math.max(cameraX + 18, Math.min(maxStageX, player.x));
    player.y = Math.max(LANE_TOP, Math.min(LANE_BOTTOM, player.y));

    if (enemies.length === 0) {
        const targetCam = player.x - V_WIDTH * 0.35;
        if (targetCam > cameraX) {
            cameraX = Math.min(maxStageX - V_WIDTH, targetCam);
        }
    } else {
        player.x = Math.min(cameraX + V_WIDTH - 18, player.x);
    }

    // Kulor
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        let hit = false;
        for (let j = 0; j < enemies.length; j++) {
            const en = enemies[j];
            if (Math.abs(b.x - en.x) < en.w * 0.65 && Math.abs(b.y - (en.y - en.h * 0.5)) < en.h * 0.55) {
                damageEnemy(en, 15, Math.sign(b.vx) * 3);
                hit = true;
                break;
            }
        }

        if (!hit && cage && !cage.broken) {
            if (Math.abs(b.x - cage.x) < 24 && Math.abs(b.y - (cage.y - 20)) < 24) {
                damageCage(15);
                hit = true;
            }
        }

        if (hit || b.life <= 0) {
            bullets.splice(i, 1);
        }
    }

    // Fiender
    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (en.hp <= 0) {
            enemies.splice(i, 1);
            continue;
        }

        if (en.hurtTimer > 0) en.hurtTimer--;
        if (en.attackCooldown > 0) en.attackCooldown--;
        en.anim += 0.16;

        const dx = player.x - en.x;
        const dy = player.y - en.y;
        const dist = Math.hypot(dx, dy);

        en.facing = dx >= 0 ? 1 : -1;

        if (dist > 26) {
            en.x += (dx / dist) * en.speed;
            en.y += (dy / dist) * (en.speed * 0.75);
        } else if (en.attackCooldown <= 0) {
            en.attackCooldown = 55;
            if (player.invulnTimer <= 0) {
                player.hp = Math.max(0, player.hp - en.dmg);
                player.invulnTimer = 35;
                screenShake = 5;
                sfx.catHit();
                spawnParticles(player.x, player.y - 16, '#ff0055', 8);
                updateHUD();

                if (player.hp <= 0) {
                    gameState = 'GAME_OVER';
                    sfx.stopBGM();
                }
            }
        }
    }

    // Skottlådor
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (Math.abs(player.x - p.x) < 24 && Math.abs(player.y - p.y) < 20) {
            if (p.type === 'ammo') {
                player.ammo += p.amount;
                sfx.pickup();
                spawnFloatingText(p.x, p.y - 22, `+${p.amount} SKOTT!`, '#fee440');
                updateHUD();
            }
            pickups.splice(i, 1);
        }
    }

    // Fläckens bur på bana 2
    if (cage && cage.broken) {
        cage.hamsterFreedTimer--;
        if (cage.hamsterFreedTimer <= 0) {
            loadStage(3);
        }
    }

    updateParticlesAndTexts();
}

// --- BANA 3: RAKETFÄRD TILL HAMSTERPLANETEN ---
function updateSpaceStage() {
    if (player.shootCooldown > 0) player.shootCooldown--;

    let moveY = 0;
    let moveX = 0;
    if (keys['ArrowUp'] || keys['KeyW']) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY += 1;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

    player.y = Math.max(36, Math.min(V_HEIGHT - 36, player.y + moveY * 2.8));
    player.x = Math.max(45, Math.min(220, player.x + moveX * 2.4));

    stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) {
            s.x = V_WIDTH;
            s.y = Math.random() * V_HEIGHT;
        }
    });

    rocket.distance += 4.5;

    if (frameCount % 48 === 0 && rocket.distance < rocket.targetDistance - 350) {
        const isAmmoPod = Math.random() < 0.25;
        if (isAmmoPod) {
            pickups.push({
                x: V_WIDTH + 20,
                y: 40 + Math.random() * (V_HEIGHT - 80),
                type: 'ammo',
                amount: 8
            });
        } else {
            enemies.push({
                x: V_WIDTH + 25,
                y: 40 + Math.random() * (V_HEIGHT - 80),
                type: 'spacecat',
                hp: 15,
                speed: 3.4 + Math.random() * 1.4,
                w: 26,
                h: 22,
                hurtTimer: 0
            });
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.life--;
        let hit = false;
        for (let j = 0; j < enemies.length; j++) {
            const en = enemies[j];
            if (Math.abs(b.x - en.x) < 18 && Math.abs(b.y - en.y) < 16) {
                en.hp -= 15;
                sfx.catHit();
                spawnParticles(en.x, en.y, '#ff9e00', 10);
                hit = true;
                break;
            }
        }
        if (hit || b.life <= 0) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.x -= en.speed;
        if (en.hp <= 0) {
            player.money += 10;
            sfx.catDefeat();
            spawnFloatingText(en.x, en.y - 12, '+10kr', '#38b000');
            updateHUD();
            enemies.splice(i, 1);
            continue;
        }
        if (Math.abs(en.x - player.x) < 28 && Math.abs(en.y - player.y) < 18) {
            player.hp = Math.max(0, player.hp - 15);
            screenShake = 6;
            sfx.catHit();
            spawnParticles(player.x, player.y, '#ff0055', 12);
            updateHUD();
            enemies.splice(i, 1);
            if (player.hp <= 0) {
                gameState = 'GAME_OVER';
                sfx.stopBGM();
            }
            continue;
        }
        if (en.x < -30) enemies.splice(i, 1);
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.x -= 3;
        if (Math.abs(p.x - player.x) < 28 && Math.abs(p.y - player.y) < 20) {
            player.ammo += p.amount;
            sfx.pickup();
            spawnFloatingText(p.x, p.y - 14, `+${p.amount} SKOTT`, '#fee440');
            updateHUD();
            pickups.splice(i, 1);
        } else if (p.x < -20) {
            pickups.splice(i, 1);
        }
    }

    if (rocket.distance >= rocket.targetDistance - 280) {
        rocket.planetX = Math.max(V_WIDTH - 95, rocket.planetX - 2.2);
    }
    if (rocket.distance >= rocket.targetDistance) {
        gameState = 'VICTORY';
        sfx.stopBGM();
        sfx.eatDogFood();
    }

    updateParticlesAndTexts();
}

function updateParticlesAndTexts() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.45;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

    ctx.scale(facing, 1);

    ctx.fillRect(-5 + step, -4, 6, 4);
    ctx.fillRect(1 - step, -4, 6, 4);

    // Turkos kropp + poncho
    ctx.fillStyle = '#00d4ff';
    ctx.fillRect(-8, -20 - bob, 16, 16);
    ctx.fillStyle = '#7b2cbf';
    ctx.fillRect(-9, -18 - bob, 18, 7);
    ctx.fillStyle = '#fee440';
    ctx.fillRect(-8, -13 - bob, 16, 1);

    // Turkost huvud
    ctx.fillStyle = '#00f5d4';
    ctx.fillRect(-7, -31 - bob, 14, 12);

    // Skugga vid ögonen (banditmask) + glödande ögon
    ctx.fillStyle = '#071921';
    ctx.fillRect(-5, -27 - bob, 12, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(2, -26 - bob, 3, 3);

    // Orange anknäbb
    ctx.fillStyle = '#ff9500';
    ctx.fillRect(6, -24 - bob, 8, 4);
    ctx.fillStyle = '#cc5803';
    ctx.fillRect(6, -21 - bob, 7, 1);

    // Cowboyhatt
    ctx.fillStyle = '#6f3e18';
    ctx.fillRect(-12, -33 - bob, 24, 3);
    ctx.fillRect(-7, -40 - bob, 14, 7);
    ctx.fillStyle = '#ffbe0b';
    ctx.fillRect(-7, -35 - bob, 14, 2);

    // Vinge & Revolver
    if (isMelee) {
        ctx.fillStyle = '#00f5d4';
        ctx.fillRect(4, -20 - bob, 18, 7);
    } else {
        ctx.fillStyle = '#00bbf9';
        ctx.fillRect(-2, -17 - bob, 9, 6);

        ctx.fillRect(7, -18 - bob, 9, 4);
        ctx.fillStyle = '#5c3317';
        ctx.fillRect(6, -15 - bob, 3, 4);
        if (isShooting) {
            ctx.fillStyle = '#fee440';
            ctx.fillRect(16, -20 - bob, 6, 6);
        }

    ctx.restore();
}

function drawCatSprite(x, y, type, facing, anim, isHurt) {
    ctx.save();
    ctx.translate(Math.floor(x), Math.floor(y));

    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(facing, 1);
    const bob = Math.abs(Math.sin(anim)) * 2;
    const isBoss = type === 'leif';
    const isChonky = type === 'chonky';

    const palette = {
        alley:  { body: '#ff3b30', stripe: '#ffe600', outline: '#ffffff', belly: '#ffd60a' },
        ninja:  { body: '#f8f9fa', stripe: '#ff0055', outline: '#111111', belly: '#dee2e6' },
        chonky: { body: '#ff9e00', stripe: '#ffffff', outline: '#240046', belly: '#ffea00' },
        leif:   { body: '#9d4edd', stripe: '#ff0055', outline: '#ffffff', belly: '#e0aaff' }
    }[type] || { body: '#ff3b30', stripe: '#ffe600', outline: '#ffffff', belly: '#ffd60a' };

    const bodyColor = isHurt ? '#ffffff' : palette.body;
    const stripeColor = isHurt ? '#ff0055' : palette.stripe;
    const outlineColor = palette.outline;
    const w = isBoss ? 22 : (isChonky ? 20 : 14);
    const h = isBoss ? 34 : 26;

    // Svans med kontur
    ctx.fillStyle = outlineColor;
    ctx.fillRect(-w / 2 - 7, -17 - bob, 8, 5);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-w / 2 - 6, -16 - bob, 6, 3);

    // Kattkropp med kontrastkontur
    ctx.fillStyle = outlineColor;
    ctx.fillRect(-w / 2 - 1, -h - 1 - bob, w + 2, h + 1);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-w / 2, -h - bob, w, h - 3);

    // Ljus mage och tydliga ränder
    ctx.fillStyle = palette.belly;
    ctx.fillRect(0, -h + 11 - bob, w / 2 - 1, h - 15);
    ctx.fillStyle = stripeColor;
    ctx.fillRect(-w / 2, -h + 13 - bob, w / 2, 2);
    ctx.fillRect(-w / 2, -h + 18 - bob, w / 2, 2);

    // Kattöron med kontur
    ctx.fillStyle = outlineColor;
    ctx.fillRect(-w / 2 - 1, -h - 6 - bob, 6, 6);
    ctx.fillRect(w / 2 - 5, -h - 6 - bob, 6, 6);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-w / 2, -h - 5 - bob, 4, 5);
    ctx.fillRect(w / 2 - 4, -h - 5 - bob, 4, 5);

    // Kattdiktatorn Leifs guldkrona och röda mantel
    if (isBoss) {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-w / 2 - 3, -h + 9 - bob, 5, 22);
        ctx.fillStyle = '#fee440';
        ctx.fillRect(-6, -h - 10 - bob, 12, 5);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-2, -h - 9 - bob, 4, 3);
    }

    // Glödande arga ögon & nos
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, -h + 3 - bob, 8, 5);
    ctx.fillStyle = isBoss ? '#00f5d4' : '#fee440';
    ctx.fillRect(1, -h + 4 - bob, 3, 3);
    ctx.fillRect(5, -h + 4 - bob, 3, 3);

    ctx.fillStyle = '#ff70a6';
    ctx.fillRect(4, -h + 9 - bob, 3, 2);

    ctx.restore();
}

    ctx.fillRect(0, 0, V_WIDTH, LANE_TOP);

    const startIdx = Math.floor(cameraX / buildingW);
    for (let i = startIdx; i <= startIdx + 5; i++) {

        ctx.fillStyle = i % 2 === 0 ? '#2b2d42' : '#33354d';
        ctx.fillRect(bx, 18, buildingW - 4, LANE_TOP - 18);

        ctx.fillStyle = i % 3 === 0 ? '#fee440' : '#141526';
        for (let wy = 34; wy < 110; wy += 28) {
            ctx.fillRect(bx + 18, wy, 16, 18);
            ctx.fillRect(bx + 54, wy, 16, 18);
            ctx.fillRect(bx + 90, wy, 16, 18);

        if (i % 2 === 0) {

            ctx.fillRect(bx + 26, 118, 68, 14);
            ctx.fillStyle = '#fff';
            ctx.font = '6px "Press Start 2P"';
            ctx.fillText('KATT-KLUBB', bx + 30, 128);

    }

    ctx.fillRect(0, LANE_TOP, V_WIDTH, V_HEIGHT - LANE_TOP);

    ctx.fillRect(0, LANE_TOP, V_WIDTH, 6);

    ctx.fillStyle = '#1b1b2f';
    ctx.fillRect(0, LANE_TOP, V_WIDTH, V_HEIGHT - LANE_TOP);
    ctx.fillStyle = '#9d4edd';
    ctx.fillRect(0, LANE_TOP, V_WIDTH, 5);
}

function drawSpaceStage() {
    ctx.fillStyle = '#050314';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    // Hamsterplaneten vid slutet
    if (rocket.planetX < V_WIDTH + 120) {
        const px = rocket.planetX;
        const py = V_HEIGHT / 2;
        ctx.fillStyle = '#ffbe0b';
        ctx.beginPath();
        ctx.arc(px, py, 78, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fb5607';
        ctx.beginPath();
        ctx.arc(px - 22, py - 24, 14, 0, Math.PI * 2);
        ctx.arc(px + 18, py + 22, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '7px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('HAMSTER-', px - 12, py - 4);
        ctx.fillText('PLANETEN', px - 12, py + 8);
    }

    // Fläckens specialbyggda raket
    ctx.save();
    ctx.translate(Math.floor(player.x), Math.floor(player.y));

    if (frameCount % 4 < 2) {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-34, -6, 14, 12);
        ctx.fillStyle = '#fee440';
        ctx.fillRect(-28, -4, 10, 8);
    }

    ctx.fillStyle = '#e0fbfc';
    ctx.fillRect(-20, -12, 42, 24);
    ctx.fillStyle = '#ff595e';
    ctx.beginPath();
    ctx.moveTo(22, -12);
    ctx.lineTo(38, 0);
    ctx.lineTo(22, 12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff595e';
    ctx.fillRect(-22, -18, 12, 6);
    ctx.fillRect(-22, 12, 12, 6);

    ctx.fillStyle = '#00bbf9';
    ctx.fillRect(-6, -8, 22, 14);
    ctx.fillStyle = '#00f5d4';
    ctx.fillRect(-3, -4, 7, 7);
    ctx.fillStyle = '#f4a261';
    ctx.fillRect(6, -3, 6, 6);

    ctx.restore();

    enemies.forEach(en => {
        ctx.save();
        ctx.translate(Math.floor(en.x), Math.floor(en.y));
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(-12, -7, 24, 14);
        ctx.fillStyle = '#00f5d4';
        ctx.fillRect(-6, -12, 12, 6);
        ctx.fillStyle = '#ffe600';
        ctx.fillRect(-10, -2, 20, 3);
        ctx.restore();
    });

    pickups.forEach(p => drawAmmoCrate(p.x, p.y));
    bullets.forEach(b => {
        ctx.fillStyle = '#00f5d4';
        ctx.fillRect(b.x - 6, b.y - 2, 12, 4);
    });

    // Framstegsmätare till Hamsterplaneten
    const progress = Math.min(1, rocket.distance / rocket.targetDistance);
    ctx.fillStyle = '#22223b';
    ctx.fillRect(110, 12, 260, 8);
    ctx.fillStyle = '#ffbe0b';
    ctx.fillRect(110, 12, 260 * progress, 8);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(110, 12, 260, 8);
}

// --- HUVUDRITA-LOOP ---
function draw() {
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);
    }

    if (gameState === 'TITLE') {
        drawTitleScreen();
    } else if (gameState === 'INTRO') {
        drawIntroScreen();
    } else if (gameState === 'GAME_OVER') {
        drawEndScreen('GAME OVER!', 'KATTDIKTATORN LEIF VANN...', '#ff0055');
    } else if (gameState === 'VICTORY') {
        drawVictoryScreen();
    } else {
        if (currentStage === 3) {
            drawSpaceStage();
        } else {
            if (currentStage === 1) drawStreetBackground();
            else drawFortressBackground();

            const renderList = [];

            pickups.forEach(p => {
                renderList.push({ y: p.y, draw: () => drawAmmoCrate(p.x - cameraX, p.y) });
            });

            if (cage) {
                renderList.push({
                    y: cage.y,
                    draw: () => {
                        const cx = Math.floor(cage.x - cameraX);
                        const cy = Math.floor(cage.y);
                        drawHamsterSprite(cx, cy - 2);
                        if (!cage.broken) {
                            ctx.strokeStyle = '#adb5bd';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(cx - 16, cy - 30, 32, 30);
                            for (let bx = -10; bx <= 10; bx += 6) {
                                ctx.beginPath();
                                ctx.moveTo(cx + bx, cy - 30);
                                ctx.lineTo(cx + bx, cy);
                                ctx.stroke();
                            }
                        }
                    }
                });
            }

            enemies.forEach(en => {
                renderList.push({
                    y: en.y,
                    draw: () => drawCatSprite(en.x - cameraX, en.y, en.type, en.facing, en.anim, en.hurtTimer > 0)
                });
            });

            renderList.push({
                y: player.y,
                draw: () => {
                    if (player.invulnTimer % 4 < 2) {
                        drawDuckSprite(player.x - cameraX, player.y, player.facing, player.walkFrame, player.shootCooldown > 9, player.meleeTimer > 0);
                    }
                }
            });

            renderList.sort((a, b) => a.y - b.y);
            renderList.forEach(item => item.draw());

            bullets.forEach(b => {
                ctx.fillStyle = '#fee440';
                ctx.fillRect(b.x - cameraX - 3, b.y - 2, 6, 3);
            });

            const leif = enemies.find(e => e.type === 'leif');
            if (leif) {
                ctx.fillStyle = '#000';
                ctx.fillRect(120, 14, 240, 12);
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(122, 16, 236 * Math.max(0, leif.hp / leif.maxHp), 8);
                ctx.fillStyle = '#fff';
                ctx.font = '7px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('BOSS: KATTDIKTATORN LEIF', V_WIDTH / 2, 11);
            }
        }

        particles.forEach(pt => {
            ctx.fillStyle = pt.color;
            const px = currentStage === 3 ? pt.x : pt.x - cameraX;
            ctx.fillRect(px, pt.y, pt.size, pt.size);
        });

        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color;
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            const fx = currentStage === 3 ? ft.x : ft.x - cameraX;
            ctx.fillText(ft.text, fx, ft.y);
        });

        if (stageMessageTimer > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(30, 42, V_WIDTH - 60, 28);
            ctx.strokeStyle = '#00f5d4';
            ctx.strokeRect(30, 42, V_WIDTH - 60, 28);
            ctx.fillStyle = '#fee440';
            ctx.font = '9px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText(stageMessage, V_WIDTH / 2, 60);
        }
    }

    ctx.restore();
}

function drawTitleScreen() {
    ctx.fillStyle = '#10002b';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // Dekorativa neonlinjer
    ctx.fillStyle = '#3c096c';
    ctx.fillRect(0, 175, V_WIDTH, 95);
    ctx.fillStyle = '#00f5d4';
    ctx.fillRect(0, 173, V_WIDTH, 3);

    // Speltitel
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f5d4';
    ctx.font = '18px "Press Start 2P"';
    ctx.fillText('DUCKVADD', V_WIDTH / 2, 48);

    ctx.fillStyle = '#ff9e00';
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText('& JAKTEN PÅ FLÄCKEN', V_WIDTH / 2, 72);

    // Hjältarna & ärkefienden på startskärmen
    drawDuckSprite(145, 160, 1, frameCount * 0.08, false, false);
    drawHamsterSprite(192, 160);
    drawCatSprite(325, 162, 'leif', -1, frameCount * 0.08, false);

    // Blinkande Start-prompt
    if (Math.floor(frameCount / 22) % 2 === 0) {
        ctx.fillStyle = '#fee440';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText('TRYCK ENTER / Z / KLICKA', V_WIDTH / 2, 206);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '7px "Press Start 2P"';
    ctx.fillText('RÄDDA FLÄCKEN & LÖRDAGSGODISEN!', V_WIDTH / 2, 232);
    ctx.fillStyle = '#adb5bd';
    ctx.fillText('30 SKOTT • KÖP HUNDMAT FÖR HÄLSA', V_WIDTH / 2, 248);
}

function drawIntroScreen() {
    const panel = INTRO_PANELS[introScene];

    ctx.fillStyle = '#0b091e';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // Yttre serieruta
    ctx.fillStyle = '#1d1e42';
    ctx.fillRect(24, 14, V_WIDTH - 48, 148);
    ctx.strokeStyle = '#00f5d4';
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 14, V_WIDTH - 48, 148);

    if (introScene === 0) {
        // Ruta 1: Duckvadd kliver in i vardagsrummet
        ctx.fillStyle = '#3d2c2e';
        ctx.fillRect(26, 118, V_WIDTH - 52, 42);
        ctx.fillStyle = '#582f0e';
        ctx.fillRect(52, 44, 46, 74);
        ctx.fillStyle = '#000';
        ctx.fillRect(58, 48, 34, 70);

        ctx.fillStyle = '#7f4f24';
        ctx.fillRect(290, 96, 86, 22);
        drawBrokenCageSprite(332, 96);

        drawDuckSprite(145, 134, 1, 0, false, false);
        ctx.fillStyle = '#fee440';
        ctx.font = '14px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('!?', 145, 76);

    } else if (introScene === 1) {
        // Ruta 2: Närbild på den uppbrutna buren & brevet
        ctx.fillStyle = '#7f4f24';
        ctx.fillRect(26, 114, V_WIDTH - 52, 46);

        drawBrokenCageSprite(185, 114);

        ctx.fillStyle = '#fff3b0';
        ctx.fillRect(275, 86, 44, 28);
        ctx.fillStyle = '#333';
        ctx.fillRect(281, 92, 28, 2);
        ctx.fillRect(281, 98, 32, 2);
        ctx.fillRect(281, 104, 20, 2);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(306, 104, 8, 8);

    } else if (introScene === 2) {
        // Ruta 3: Kattdiktatorn Leifs onda plan (Robothamster + Godisfabrik)
        ctx.fillStyle = '#240046';
        ctx.fillRect(26, 16, V_WIDTH - 52, 144);

        ctx.fillStyle = '#ff595e';
        ctx.fillRect(56, 74, 84, 56);
        ctx.fillStyle = '#fee440';
        ctx.fillRect(72, 44, 14, 30);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(98, 62, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(98, 62, 7, 0, Math.PI * 2);
        ctx.fill();

        drawHamsterSprite(225, 122);
        ctx.strokeStyle = '#00f5d4';
        ctx.lineWidth = 2;
        ctx.strokeRect(212, 98, 26, 26);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(220, 111, 10, 3);

        drawCatSprite(345, 130, 'leif', -1, 0, false);
        ctx.fillStyle = '#ff0055';
        ctx.font = '8px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('MUAHAHA!', 345, 62);

    } else if (introScene === 3) {
        // Ruta 4: Duckvadd redo för strid med revolvern!
        ctx.fillStyle = '#1b1b3a';
        ctx.fillRect(26, 16, V_WIDTH - 52, 144);

        ctx.fillStyle = '#00e5ff';
        for (let ly = 30; ly < 150; ly += 22) {
            ctx.fillRect(34, ly, 90 + (ly % 40), 2);
            ctx.fillRect(320 - (ly % 30), ly + 8, 110, 2);
        }

        drawDuckSprite(V_WIDTH / 2, 134, 1, 0, true, false);
        ctx.fillStyle = '#fee440';
        ctx.font = '9px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('LÖRDAGSGODISEN SKA RÄDDAS!', V_WIDTH / 2, 54);
    }

    // Dialogruta längst ner
    ctx.fillStyle = '#111122';
    ctx.fillRect(24, 170, V_WIDTH - 48, 86);
    ctx.strokeStyle = '#ff9e00';
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 170, V_WIDTH - 48, 86);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#00f5d4';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(panel.title, 36, 186);

    ctx.fillStyle = '#ffffff';
    ctx.font = '8px "Press Start 2P"';
    panel.lines.forEach((line, i) => {
        ctx.fillText(line, 36, 203 + i * 13);
    });

    if (Math.floor(frameCount / 20) % 2 === 0) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fee440';
        ctx.font = '7px "Press Start 2P"';
        const prompt = introScene < INTRO_PANELS.length - 1 ? 'NÄSTA (Z / KLICKA) ►' : 'STARTA SPELET! ►';
        ctx.fillText(prompt, V_WIDTH - 34, 249);
    }
}

function drawBrokenCageSprite(x, y) {
    ctx.save();
    ctx.translate(Math.floor(x), Math.floor(y));
    ctx.strokeStyle = '#adb5bd';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-18, -28);
    ctx.lineTo(-18, 0);
    ctx.lineTo(18, 0);
    ctx.lineTo(18, -14);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-10, -28);
    ctx.lineTo(-13, -12);
    ctx.moveTo(-2, -26);
    ctx.lineTo(4, -10);
    ctx.stroke();

    ctx.strokeStyle = '#ff595e';
    ctx.beginPath();
    ctx.moveTo(18, -14);
    ctx.lineTo(30, -4);
    ctx.stroke();
    ctx.restore();
}

function drawEndScreen(title, sub, color) {
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    ctx.font = '18px "Press Start 2P"';
    ctx.fillText(title, V_WIDTH / 2, 105);

    ctx.fillStyle = '#fff';
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText(sub, V_WIDTH / 2, 138);

    ctx.fillStyle = '#fee440';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('TRYCK ENTER / KLICKA FÖR NYTT FÖRSÖK', V_WIDTH / 2, 185);
}

function drawVictoryScreen() {
    ctx.fillStyle = '#10002b';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    ctx.fillStyle = '#ffbe0b';
    ctx.fillRect(0, 195, V_WIDTH, 75);

    drawDuckSprite(210, 195, 1, 0, false, false);
    drawHamsterSprite(255, 195);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f5d4';
    ctx.font = '14px "Press Start 2P"';
    ctx.fillText('GRATTIS! NI KLARADE DET!', V_WIDTH / 2, 52);

    ctx.fillStyle = '#fee440';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('FLÄCKEN ÄR HEMMA PÅ HAMSTERPLANETEN', V_WIDTH / 2, 82);
    ctx.fillText('OCH BARNENS LÖRDAGSGODIS ÄR RÄDDAT!', V_WIDTH / 2, 100);

    ctx.fillStyle = '#ffffff';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(`POÄNG / KASSA: ${player.money} KR`, V_WIDTH / 2, 130);

    ctx.fillStyle = '#ff9e00';
    ctx.fillText('TRYCK ENTER / KLICKA FÖR ATT SPELA IGEN', V_WIDTH / 2, 238);
}

// --- STARTA SPELMOTOR ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

window.onload = () => {
    canvas.focus();
    updateHUD();
    gameLoop();
};
</script>
